}
.wave-check{
  display:block;
  animation: olaCheck 2s infinite ease-in-out, brilloCheck 2s infinite ease-in-out;
}
.wave-check:nth-child(1){animation-delay:0s}
.wave-check:nth-child(2){animation-delay:0.15s}
.wave-check:nth-child(3){animation-delay:0.30s}
.wave-check:nth-child(4){animation-delay:0.45s}
.wave-check.tick{
  display:inline-block;

  filter: drop-shadow(0 0 6px #00FF88);

}
